name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-ui:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check tag matches pyproject version
        shell: bash
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$ver" ]; then
            echo "tag $tag must equal v$ver"
            exit 1
          fi

      - name: Install UI deps (no ASR extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e .

      - name: Build frontend
        run: |
          npm ci
        working-directory: web

      - name: Vite build
        run: npm run build
        working-directory: web

      - name: Package UI zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # 许可白名单由 CI 检查。这里不装开发依赖，避免 pytest 被打进 exe。
          python scripts/check_notices.py
          python scripts/collect_licenses.py --check
          python scripts/package_windows.py --ui

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/huiyiku-windows-x64.zip
            packaging/dist/SHA256SUMS
            packaging/dist/sbom-huiyiku-*.cdx.json
          body: |
            ## 会议库 ${{ github.ref_name }}

            - UI：`huiyiku-windows-x64.zip`（无 torch / 无权重 / 无 FFmpeg 二进制 / 无 portable.txt）
            - ASR：请用本机构建 `python scripts/package_windows.py --asr` 或后续上传 `huiyiku-asr-windows-x64.zip`（约 1–3GB，`licenses/` 与 `THIRD_PARTY_NOTICES_ASR.md` 已由门禁强制随包）
            - SBOM：`sbom-huiyiku-<version>.cdx.json`（CycloneDX 1.5，覆盖冻结组件）
            - 自备 [FFmpeg](https://www.ffmpeg.org/download.html)
            - exe **未签名**，SmartScreen 可能拦截。请核对本文件的 SHA256。
            - 转写在本机；报告/问答会把转写文本发到你自己的 LLM。

            日常 CI 不构建 ASR 包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
