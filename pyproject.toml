[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huiyiku"
version = "0.1.0"
description = "会议库：本机会议录音知识库（FunASR 转写、校对、带引用问答）。LLM 使用你自己的云 API。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "会议库 contributors" }]
keywords = ["meeting", "asr", "fastapi", "sqlite", "windows", "chinese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "jieba>=0.42.1",
  "python-multipart>=0.0.9",
  "pywebview>=5.4,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
huiyiku = "huiyiku.__main__:main"
huiyiku-asr = "huiyiku_asr.__main__:main"

[project.urls]
License = "https://www.apache.org/licenses/LICENSE-2.0"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
huiyiku = ["py.typed", "db/schema.sql"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["huiyiku", "huiyiku.*", "huiyiku_asr", "huiyiku_asr.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
